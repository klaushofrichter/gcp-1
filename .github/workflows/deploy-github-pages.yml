name: Deploy MCP HTTP Server to GitHub Pages

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for GitHub Pages
        run: |
          mkdir -p dist
          cp -r * dist/ || true
          cp package*.json dist/
          cd dist && npm ci --only=production
        env:
          NODE_ENV: production
          GITHUB_PAGES: true
      
      - name: Create start script
        run: |
          echo '#!/bin/sh' > dist/start.sh
          echo 'export NODE_ENV=production' >> dist/start.sh
          echo 'export GITHUB_PAGES=true' >> dist/start.sh
          echo 'export PORT=8080' >> dist/start.sh
          echo 'node mcp-server-http.js' >> dist/start.sh
          chmod +x dist/start.sh
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 