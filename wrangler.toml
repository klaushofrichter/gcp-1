name = "quotes-mcp-server"
main = "cloudflare-worker-mcp.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Durable Objects bindings (for session management)
[[durable_objects.bindings]]
name = "MCP_SESSIONS"
class_name = "MCPSessionManager"

# Durable Objects migrations (free plan requires new_sqlite_classes)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MCPSessionManager"]

# quotes.json is automatically included in the deployment when imported via ES6 modules
# The file is bundled by Wrangler during deployment process
# No additional configuration needed for JSON imports

# For development
[env.development]
name = "quotes-mcp-server-dev"
vars = { ENVIRONMENT = "development" }

# For staging
[env.staging]
name = "quotes-mcp-server-staging"
vars = { ENVIRONMENT = "staging" } 